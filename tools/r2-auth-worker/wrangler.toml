# Cloudflare Worker config for the AudiobookReader Worker (R2 proxy + /auth).
#
# Customise:
#   - `name`: appears in the deployed URL as <name>.<account>.workers.dev
#   - `bucket_name`: must match your R2 bucket
#   - `ALLOWED_EMAILS`: comma-separated Google account allowlist
#   - `CORS_ALLOWED_ORIGINS`: origins from which the web app makes requests
#     (also the set of allowed /auth/login return origins, unless APP_ORIGINS
#     is set)
#   - `GOOGLE_CLIENT_ID`: pin to your OAuth client so foreign tokens are
#     rejected (set to "" to skip audience verification)
#
# SECRET (NOT in this file — set via dashboard or `wrangler secret put`):
#   - `GOOGLE_CLIENT_SECRET`: OAuth web client secret. Required by the
#     /auth/* Authorization-Code flow. The session-encryption key is derived
#     from it (HKDF), so there is no separate key/secret to manage.
#   Add it in the Cloudflare dashboard:
#     Workers & Pages → this worker → Settings → Variables and Secrets →
#     Add → type Secret → name GOOGLE_CLIENT_SECRET.

name = "audiobookreader-r2"
main = "src/index.js"
compatibility_date = "2026-05-16"

# Bind the R2 bucket so the Worker can read it without S3 credentials.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "audiobooks"

[vars]
GOOGLE_CLIENT_ID = "524735149839-e3pfcqlji0ij1f45tpf3af2ivqkosdgg.apps.googleusercontent.com"
ALLOWED_EMAILS = "antti.rasi@gmail.com,anu.hynninen2@gmail.com"
CORS_ALLOWED_ORIGINS = "http://localhost:8000,http://127.0.0.1:8000,https://anttir.github.io"

# Optional: observability — uncomment to enable Tail logs in the dashboard
# [observability]
# enabled = true
